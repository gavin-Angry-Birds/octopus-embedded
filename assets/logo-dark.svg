<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <!-- Core Hub Gradient -->
    <linearGradient id="darkLogoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="darkLogoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="darkLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Icon Mark (Centered around cx=85, cy=80) -->
  <g transform="translate(15, 10) scale(0.85)">
    <!-- 8 Radiating Tentacles / Bus Channels -->
    <g stroke="url(#darkLogoAccentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 85 50 L 85 18 L 73 6" />
      <path d="M 85 30 L 97 18" />
      <path d="M 108 59 L 140 27 L 158 27" />
      <path d="M 118 80 L 152 80 L 164 68" />
      <path d="M 140 80 L 152 92" />
      <path d="M 108 101 L 140 133 L 140 148" />
      <path d="M 85 110 L 85 142 L 97 154" />
      <path d="M 62 101 L 30 133 L 12 133" />
      <path d="M 52 80 L 18 80 L 6 92" />
      <path d="M 30 80 L 18 68" />
      <path d="M 62 59 L 30 27 L 30 12" />
    </g>

    <!-- Peripheral Target Nodes -->
    <g fill="#38BDF8" filter="url(#darkLogoGlow)">
      <circle cx="73" cy="6" r="4.5" />
      <circle cx="97" cy="18" r="3.5" />
      <circle cx="158" cy="27" r="4.5" />
      <circle cx="164" cy="68" r="4.5" />
      <circle cx="152" cy="92" r="3.5" />
      <circle cx="140" cy="148" r="4.5" />
      <circle cx="97" cy="154" r="4.5" />
      <circle cx="12" cy="133" r="4.5" />
      <circle cx="6" cy="92" r="4.5" />
      <circle cx="18" cy="68" r="3.5" />
      <circle cx="30" cy="12" r="4.5" />
    </g>

    <!-- Central Hexagonal Hub -->
    <g filter="url(#darkLogoGlow)">
      <polygon points="85,45 119,65 119,95 85,115 51,95 51,65"
               fill="#0B1329" stroke="url(#darkLogoAccentGrad)" stroke-width="4" stroke-linejoin="round" />
      
      <polygon points="85,55 110,69 110,91 85,105 60,91 60,69"
               fill="url(#darkLogoCoreGrad)" />

      <circle cx="85" cy="80" r="9" fill="#F0FDFA" />
      <circle cx="85" cy="80" r="4.5" fill="#0D9488" />
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="180" y1="35" x2="180" y2="125" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Right: Typography for Dark Backgrounds -->
  <g transform="translate(205, 0)">
    <text x="0" y="74" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="58px" letter-spacing="-0.5px">Octopus</text>
    <text x="2" y="106" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20px" letter-spacing="7px">EMBEDDED</text>
    <text x="4" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13px" letter-spacing="0.5px">Cross-SoC High-Reliability Platform</text>
  </g>
</svg>
