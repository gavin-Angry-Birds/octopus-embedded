<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Core Hub Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Background Subtle Grid / Circuit Accent -->
  <g opacity="0.12" stroke="#06B6D4" stroke-width="2">
    <circle cx="256" cy="256" r="190" fill="none" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="4 6" />
  </g>

  <!-- 8 Radiating Tentacles / Bus Channels -->
  <!-- Top (0 deg) -->
  <g stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- North -->
    <path d="M 256 186 L 256 100 L 236 80" />
    <path d="M 256 130 L 276 110" />

    <!-- North-East -->
    <path d="M 305 205 L 368 142 L 398 142" />
    <path d="M 345 165 L 355 185" />

    <!-- East -->
    <path d="M 326 256 L 412 256 L 432 236" />
    <path d="M 382 256 L 402 276" />

    <!-- South-East -->
    <path d="M 305 307 L 368 370 L 368 400" />
    <path d="M 345 347 L 365 337" />

    <!-- South -->
    <path d="M 256 326 L 256 412 L 276 432" />
    <path d="M 256 382 L 236 402" />

    <!-- South-West -->
    <path d="M 207 307 L 144 370 L 114 370" />
    <path d="M 167 347 L 157 327" />

    <!-- West -->
    <path d="M 186 256 L 100 256 L 80 276" />
    <path d="M 130 256 L 110 236" />

    <!-- North-West -->
    <path d="M 207 205 L 144 142 L 144 112" />
    <path d="M 167 165 L 147 175" />
  </g>

  <!-- Peripheral Nodes (8 Target / Peripheral Points) -->
  <g fill="#38BDF8" filter="url(#glow)">
    <circle cx="236" cy="80" r="7" />
    <circle cx="276" cy="110" r="5" />
    <circle cx="398" cy="142" r="7" />
    <circle cx="355" cy="185" r="5" />
    <circle cx="432" cy="236" r="7" />
    <circle cx="402" cy="276" r="5" />
    <circle cx="368" cy="400" r="7" />
    <circle cx="365" cy="337" r="5" />
    <circle cx="276" cy="432" r="7" />
    <circle cx="236" cy="402" r="5" />
    <circle cx="114" cy="370" r="7" />
    <circle cx="157" cy="327" r="5" />
    <circle cx="80" cy="276" r="7" />
    <circle cx="110" cy="236" r="5" />
    <circle cx="144" cy="112" r="7" />
    <circle cx="147" cy="175" r="5" />
  </g>

  <!-- Central Platform Hub (Hexagonal Core) -->
  <g filter="url(#glow)">
    <!-- Outer Hex Ring -->
    <polygon points="256,176 325,216 325,296 256,336 187,296 187,216"
             fill="#0F172A" stroke="url(#accentGrad)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Inner Solid Hex Core -->
    <polygon points="256,198 306,227 306,285 256,314 206,285 206,227"
             fill="url(#coreGrad)" />

    <!-- Center Pulse / Kernel Point -->
    <circle cx="256" cy="256" r="16" fill="#F0FDFA" />
    <circle cx="256" cy="256" r="8" fill="#0D9488" />
  </g>
</svg>
