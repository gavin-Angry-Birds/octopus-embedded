<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <!-- Core Hub Gradient -->
    <linearGradient id="logoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 58px;
        letter-spacing: -0.5px;
        fill: #0F172A;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 7px;
        fill: #0D9488;
      }
      .brand-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.5px;
        fill: #64748B;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title {
          fill: #F8FAFC;
        }
        .brand-subtitle {
          fill: #2DD4BF;
        }
        .brand-badge {
          fill: #94A3B8;
        }
      }
    </style>
  </defs>

  <!-- Left: Icon Mark (Centered around cx=85, cy=80) -->
  <g transform="translate(15, 10) scale(0.85)">
    <!-- 8 Radiating Tentacles / Bus Channels -->
    <g stroke="url(#logoAccentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- N -->
      <path d="M 85 50 L 85 18 L 73 6" />
      <path d="M 85 30 L 97 18" />
      <!-- NE -->
      <path d="M 108 59 L 140 27 L 158 27" />
      <!-- E -->
      <path d="M 118 80 L 152 80 L 164 68" />
      <path d="M 140 80 L 152 92" />
      <!-- SE -->
      <path d="M 108 101 L 140 133 L 140 148" />
      <!-- S -->
      <path d="M 85 110 L 85 142 L 97 154" />
      <!-- SW -->
      <path d="M 62 101 L 30 133 L 12 133" />
      <!-- W -->
      <path d="M 52 80 L 18 80 L 6 92" />
      <path d="M 30 80 L 18 68" />
      <!-- NW -->
      <path d="M 62 59 L 30 27 L 30 12" />
    </g>

    <!-- Peripheral Target Nodes -->
    <g fill="#38BDF8" filter="url(#logoGlow)">
      <circle cx="73" cy="6" r="4.5" />
      <circle cx="97" cy="18" r="3.5" />
      <circle cx="158" cy="27" r="4.5" />
      <circle cx="164" cy="68" r="4.5" />
      <circle cx="152" cy="92" r="3.5" />
      <circle cx="140" cy="148" r="4.5" />
      <circle cx="97" cy="154" r="4.5" />
      <circle cx="12" cy="133" r="4.5" />
      <circle cx="6" cy="92" r="4.5" />
      <circle cx="18" cy="68" r="3.5" />
      <circle cx="30" cy="12" r="4.5" />
    </g>

    <!-- Central Hexagonal Hub -->
    <g filter="url(#logoGlow)">
      <polygon points="85,45 119,65 119,95 85,115 51,95 51,65"
               fill="#0F172A" stroke="url(#logoAccentGrad)" stroke-width="4" stroke-linejoin="round" />
      
      <polygon points="85,55 110,69 110,91 85,105 60,91 60,69"
               fill="url(#logoCoreGrad)" />

      <circle cx="85" cy="80" r="9" fill="#F0FDFA" />
      <circle cx="85" cy="80" r="4.5" fill="#0D9488" />
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="180" y1="35" x2="180" y2="125" stroke="#0D9488" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Right: Typography -->
  <g transform="translate(205, 0)">
    <!-- Primary Line: Octopus -->
    <text x="0" y="74" class="brand-title">Octopus</text>
    
    <!-- Secondary Line: EMBEDDED -->
    <text x="2" y="106" class="brand-subtitle">EMBEDDED</text>
    
    <!-- Optional Platform Descriptor Tag -->
    <text x="4" y="132" class="brand-badge">Cross-SoC High-Reliability Platform</text>
  </g>
</svg>
